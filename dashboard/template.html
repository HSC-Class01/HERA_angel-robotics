<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>엔젤로보틱스 재무 대시보드</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script><style>body{margin:0;background:#f4f7fb;color:#14243b;font:15px Arial,sans-serif}header{padding:30px max(20px,calc((100vw - 1150px)/2));background:linear-gradient(120deg,#10243e,#1769aa);color:white}main{max-width:1150px;margin:24px auto;padding:0 18px}.cards,.charts{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.cards{grid-template-columns:repeat(4,1fr)}.card{background:white;border:1px solid #e2e9f1;border-radius:14px;padding:18px}.label{color:#65758a;font-size:12px}.value{font-size:24px;font-weight:bold;margin:7px 0}.chart{height:300px}.section{margin-top:28px}.tabs{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.tab{padding:10px 14px;border:1px solid #dce5ef;background:white;border-radius:8px;cursor:pointer}.active{background:#1769aa;color:white}.wrap{overflow:auto;background:white;border:1px solid #e2e9f1;border-radius:12px}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{padding:10px;text-align:right;border-bottom:1px solid #edf1f5}th{background:#eef3f9}td:first-child,th:first-child{text-align:left}.muted{color:#65758a}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}}</style></head><body><header><h1>엔젤로보틱스 재무 대시보드</h1><p>OpenDART 공시 기반 · 재무 성과와 건전성</p><small id="updated"></small></header><main><div class="cards" id="cards"></div><div class="charts"><section class="card"><h2>매출 및 영업손익</h2><div id="chart1" class="chart"></div></section><section class="card"><h2>수익성 추이</h2><div id="chart2" class="chart"></div></section></div><section class="section"><h2>재무 테이블</h2><p class="muted">API 원자료 기준 단위. 결측치는 — 로 표시합니다.</p><div class="tabs"><button class="tab active" data-cat="annual">Annual · 사업보고서</button><button class="tab" data-cat="half_year">Half-year · 반기보고서</button><button class="tab" data-cat="quarterly">Quarterly · 분기보고서</button></div><div id="tbl" class="wrap"></div></section><section class="section"><h2>국내 Peer Firms</h2><p class="muted">사업영역 인접 후보이며 직접 비교 전 최신 공시 범위를 확인하세요.</p><div id="peer" class="wrap"></div></section><p class="muted">출처: <a href="https://opendart.fss.or.kr/">OpenDART</a> · <a href="https://github.com/HSC-Class01/HERA_angel-robotics">GitHub 저장소</a></p></main><script>const D=__DATA__,R=D.metrics||[],fmt=v=>v==null||!Number.isFinite(Number(v))?'—':new Intl.NumberFormat('ko-KR',{maximumFractionDigits:0}).format(Number(v)),pct=v=>v==null?'—':Number(v).toFixed(1)+'%';document.getElementById('updated').textContent='업데이트: '+new Date(D.updated).toLocaleString('ko-KR');let aa=R.filter(x=>x.category==='annual').sort((a,b)=>b.year-a.year),last=aa[0]||R.slice().sort((a,b)=>b.year-a.year)[0];document.getElementById('cards').innerHTML=[['최근 매출',last?fmt(last.revenue):'—'],['영업이익(손실)',last?fmt(last.operating_income):'—'],['당기순이익(손실)',last?fmt(last.net_income):'—'],['부채비율',last?pct(last.debt_to_equity_pct):'—']].map(x=>'<div class="card"><div class="label">'+x[0]+'</div><div class="value">'+x[1]+'</div><div class="label">최근 수집 보고서 기준</div></div>').join('');aa=aa.slice().sort((a,b)=>a.year-b.year);if(window.Plotly){Plotly.newPlot('chart1',[{x:aa.map(x=>x.year),y:aa.map(x=>x.revenue),type:'bar',name:'매출'},{x:aa.map(x=>x.year),y:aa.map(x=>x.operating_income),type:'scatter',mode:'lines+markers',name:'영업손익',yaxis:'y2'}],{margin:{l:50,r:50,t:5,b:40},legend:{orientation:'h'},xaxis:{title:'연도'},yaxis:{title:'금액'},yaxis2:{overlaying:'y',side:'right'}},{responsive:true,displayModeBar:false});Plotly.newPlot('chart2',[{x:aa.map(x=>x.year),y:aa.map(x=>x.operating_margin_pct),type:'scatter',mode:'lines+markers',name:'영업이익률'},{x:aa.map(x=>x.year),y:aa.map(x=>x.net_margin_pct),type:'scatter',mode:'lines+markers',name:'순이익률'}],{margin:{l:50,r:20,t:5,b:40},legend:{orientation:'h'},xaxis:{title:'연도'},yaxis:{title:'%' }},{responsive:true,displayModeBar:false})}const C=[['year','연도'],['report_type','보고서'],['fs_div','구분'],['revenue','매출'],['operating_income','영업손익'],['net_income','순이익'],['total_assets','자산총계'],['total_liabilities','부채총계'],['total_equity','자본총계'],['cash_flow_operations','영업현금흐름'],['free_cash_flow','잉여현금흐름'],['debt_to_equity_pct','부채비율'],['current_ratio_pct','유동비율'],['operating_margin_pct','영업이익률'],['net_margin_pct','순이익률'],['roa_pct','ROA'],['roe_pct','ROE']];function draw(cat){let a=R.filter(x=>x.category===cat).sort((a,b)=>b.year-a.year);if(!a.length){document.getElementById('tbl').innerHTML='<p style="padding:24px">데이터 없음 — API 키 등록 후 Actions를 실행하세요.</p>';return}document.getElementById('tbl').innerHTML='<table><thead><tr>'+C.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr></thead><tbody>'+a.map(r=>'<tr>'+C.map(c=>{let v=r[c[0]];if(c[0].endsWith('_pct'))v=pct(v);else if(['revenue','operating_income','net_income','total_assets','total_liabilities','total_equity','cash_flow_operations','free_cash_flow'].includes(c[0]))v=fmt(v);return '<td>'+(v==null?'—':v)+'</td>'}).join('')+'</tr>').join('')+'</tbody></table>'}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw(b.dataset.cat)});document.getElementById('peer').innerHTML='<table><thead><tr><th>기업</th><th>영역</th><th>비교성</th><th>상장/공시</th></tr></thead><tbody>'+D.peers.map(p=>'<tr>'+p.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table>';draw('annual');</script></body></html>
