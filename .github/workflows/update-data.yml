name: DART financial update

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 1 * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dart-financial-update
  cancel-in-progress: false

jobs:
  collect-analyze-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Validate Python syntax and calculations
        run: |
          python -m py_compile src/update_data.py tests/test_update_data.py
          python -m unittest discover -s tests -v
      - name: Collect DART data and rebuild dashboard
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python src/update_data.py
      - name: Commit data and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data dashboard
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: monthly DART data update"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dashboard
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
